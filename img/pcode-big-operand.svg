<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">變長運算元：最高位決定要不要吃第二個位元組</text>

  <!-- 短形式 -->
  <g transform="translate(40,58)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#1a1a1a">短形式（值 0–127）</text>
    <text x="0" y="20" font-size="12" fill="#555">例：<tspan font-family="monospace" font-size="13">26</tspan> → 38</text>

    <!-- 8 個位元格 -->
    <g transform="translate(0,34)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="#fff3e0" stroke="#e08b3a" stroke-width="2"/>
      <text x="17" y="22" text-anchor="middle" font-size="15" font-family="monospace" fill="#b35c00">0</text>
      <g fill="#fafafa" stroke="#bbb" stroke-width="1.5">
        <rect x="36" y="0" width="34" height="34" rx="4"/>
        <rect x="72" y="0" width="34" height="34" rx="4"/>
        <rect x="108" y="0" width="34" height="34" rx="4"/>
        <rect x="144" y="0" width="34" height="34" rx="4"/>
        <rect x="180" y="0" width="34" height="34" rx="4"/>
        <rect x="216" y="0" width="34" height="34" rx="4"/>
        <rect x="252" y="0" width="34" height="34" rx="4"/>
      </g>
      <g text-anchor="middle" font-size="15" font-family="monospace" fill="#333">
        <text x="53" y="22">0</text><text x="89" y="22">1</text><text x="125" y="22">0</text>
        <text x="161" y="22">0</text><text x="197" y="22">1</text><text x="233" y="22">1</text><text x="269" y="22">0</text>
      </g>
      <text x="17" y="50" text-anchor="middle" font-size="10" fill="#b35c00">旗標</text>
      <text x="161" y="50" text-anchor="middle" font-size="10" fill="#777">值的 7 個位元</text>

      <path d="M 296 17 L 322 17" stroke="#888" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="334" y="22" font-size="14" fill="#1a1a1a">值 = <tspan font-weight="600">38</tspan>，一個位元組結束</text>
    </g>
  </g>

  <line x1="40" y1="176" x2="580" y2="176" stroke="#e5e5e5" stroke-width="1"/>

  <!-- 長形式 -->
  <g transform="translate(40,200)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#1a1a1a">長形式（值 128–32767）</text>
    <text x="0" y="20" font-size="12" fill="#555">例：<tspan font-family="monospace" font-size="13">87 73</tspan> → 0x773</text>

    <g transform="translate(0,34)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="#fdecec" stroke="#c94f4f" stroke-width="2"/>
      <text x="17" y="22" text-anchor="middle" font-size="15" font-family="monospace" fill="#a83232">1</text>
      <g fill="#fafafa" stroke="#bbb" stroke-width="1.5">
        <rect x="36" y="0" width="34" height="34" rx="4"/>
        <rect x="72" y="0" width="34" height="34" rx="4"/>
        <rect x="108" y="0" width="34" height="34" rx="4"/>
        <rect x="144" y="0" width="34" height="34" rx="4"/>
        <rect x="180" y="0" width="34" height="34" rx="4"/>
        <rect x="216" y="0" width="34" height="34" rx="4"/>
        <rect x="252" y="0" width="34" height="34" rx="4"/>
      </g>
      <g text-anchor="middle" font-size="15" font-family="monospace" fill="#333">
        <text x="53" y="22">0</text><text x="89" y="22">0</text><text x="125" y="22">0</text>
        <text x="161" y="22">0</text><text x="197" y="22">1</text><text x="233" y="22">1</text><text x="269" y="22">1</text>
      </g>

      <rect x="300" y="0" width="180" height="34" rx="4" fill="#eef4fb" stroke="#5b87b8" stroke-width="1.5"/>
      <text x="390" y="22" text-anchor="middle" font-size="15" font-family="monospace" fill="#2f5d8a">0x73（第二個位元組）</text>

      <text x="17" y="50" text-anchor="middle" font-size="10" fill="#a83232">旗標</text>
      <text x="161" y="50" text-anchor="middle" font-size="10" fill="#777">高 7 位</text>
      <text x="390" y="50" text-anchor="middle" font-size="10" fill="#2f5d8a">低 8 位</text>
    </g>

    <text x="0" y="106" font-size="14" fill="#1a1a1a">值 = ((第一個 &amp; 0x7f) &lt;&lt; 8) | 第二個 = <tspan font-family="monospace" font-weight="600">0x0773</tspan></text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
</svg>
