<text x="654" y="132" font-size="12" fill="#666">F 是欄位，· 是同一個 word 裡的鄰居</text>
<rect x="96" y="158" width="620" height="60" rx="5" fill="#fdf1e7" stroke="#e07b39" stroke-width="1.3"/>
<text x="112" y="180" font-size="13" font-weight="bold" fill="#a4501a">Pack-ptr：堆疊上的三個 word</text>
<text x="112" y="203" font-size="12.5" fill="#7a4a1c">TOS = 4（最右 bit 編號）　　TOS−1 = 4（位元數）　　TOS−2 = 那個 word 的位址</text>
<text x="732" y="182" font-size="12" fill="#666">一個 16-bit 位址塞不下這三件事，</text>
<text x="732" y="200" font-size="12" fill="#666">所以拆成三個 word 放堆疊。</text>
<text x="40" y="256" font-size="13" font-weight="bold" fill="#333">LDP 怎麼把它取出來</text>
<text x="40" y="276" font-size="12" fill="#888">d0 = 4（最右 bit 編號）　d1 = 16 − 4 = 12</text>
