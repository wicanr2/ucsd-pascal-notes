<text x="40" y="36" font-size="17" font-weight="bold" fill="#222">packed 欄位：三元組定址，與取值的三次移位</text>
<text x="40" y="58" font-size="13" fill="#666">例子是一個寬 4 bit、最右 bit 編號為 4 的欄位——也就是佔住 bit 7 到 bit 4。</text>
